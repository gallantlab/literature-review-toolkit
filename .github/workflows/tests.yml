name: tests

# Lint + regression tests for tools/, on every push and pull request.
# (docs.yml only rebuilds the site, and only when docs/ changes — before this
# workflow existed the regression tests never ran in CI.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The floor, the middle of the range, and the version development
      # actually happens on. Proving only one of them left both ends
      # unverified: pyproject claimed py39, nothing had ever run on 3.9, and
      # development is on 3.14. 3.9 is not the floor any more -- it reached
      # end of life in October 2025 and setup-python cannot install it on the
      # current runner image, so the claim was unverifiable as well as stale.
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tools/version.py derives the version from the full commit history
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: lint (ruff, config in pyproject.toml)
        run: ruff check .
      - name: regression tests
        run: python3 tools/tests/test_formatting.py
      - name: generated docs are fresh
        run: python3 tools/gen_docs.py --check
